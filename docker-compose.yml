version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: playlist_scholar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-playlist_scholar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: playlist_scholar_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: playlist_scholar_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playlist_scholar_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/playlist_scholar
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: celery
      DEMO_MODE: ${DEMO_MODE:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-300}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-3}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ENABLE_WEB_RESEARCH: ${ENABLE_WEB_RESEARCH:-true}
      PDF_RENDERER: playwright
      STORAGE_DIR: /app/storage
      ENABLE_RESEARCH_MODULE: ${ENABLE_RESEARCH_MODULE:-true}
      RESEARCH_OPENAI_MODEL: ${RESEARCH_OPENAI_MODEL:-gpt-4o-mini}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1-mini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-synthara-storage}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - ./storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playlist_scholar_worker
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/playlist_scholar
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: celery
      DEMO_MODE: ${DEMO_MODE:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-300}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-3}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ENABLE_WEB_RESEARCH: ${ENABLE_WEB_RESEARCH:-true}
      PDF_RENDERER: playwright
      STORAGE_DIR: /app/storage
      ENABLE_RESEARCH_MODULE: ${ENABLE_RESEARCH_MODULE:-true}
      RESEARCH_OPENAI_MODEL: ${RESEARCH_OPENAI_MODEL:-gpt-4o-mini}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1-mini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-synthara-storage}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - ./storage:/app/storage
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playlist_scholar_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

