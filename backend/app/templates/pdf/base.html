<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ playlist.title }} — Playlist Scholar Technical Reference</title>
    <style>
        {{ css_styles | safe }}
    </style>
    {% if mermaid_js %}
    <script>
        {{ mermaid_js | safe }}
    </script>
    <script>
        if (window.mermaid) {
            window.mermaid.parseError = function(err, hash) {
                // Suppress browser DOM error injection
            };
            window.mermaid.initialize({
                startOnLoad: false,
                suppressErrorRendering: true,
                theme: 'base',
                securityLevel: 'loose',
                themeVariables: {
                    primaryColor: '#F5F7F9',
                    primaryTextColor: '#202B36',
                    primaryBorderColor: '#D9E0E6',
                    lineColor: '#5F6B76',
                    secondaryColor: '#EBF1F5',
                    tertiaryColor: '#FFFFFF',
                    fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    fontSize: '11px',
                    edgeLabelBackground: '#FFFFFF',
                    clusterBkg: '#FAFBFD',
                    clusterBorder: '#D9E0E6'
                }
            });
        }
    </script>
    {% endif %}
</head>
<body>

    <!-- Cover Page -->
    {% include "cover.html" %}

    <!-- Table of Contents -->
    {% include "toc.html" %}

    <!-- Chapters in Original Playlist Sequence -->
    {% for item in chapters %}
        {% set loop_index = loop.index %}
        {% include "chapter.html" %}
    {% endfor %}

    <!-- Consolidated Capstone Revision -->
    {% include "revision.html" %}

</body>
</html>
