<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ playlist.title }} — Playlist Scholar Study Guide</title>
    <style>
        {{ css_styles }}
    </style>
    {% if mermaid_js %}
    <script>
        {{ mermaid_js }}
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.mermaid) {
                window.mermaid.initialize({
                    startOnLoad: true,
                    theme: 'neutral',
                    securityLevel: 'loose',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
                });
            }
        });
    </script>
    {% endif %}
</head>
<body>

    <!-- Cover Page -->
    {% include "cover.html" %}

    <!-- Table of Contents -->
    {% include "toc.html" %}

    <!-- Chapters in Original Playlist Sequence -->
    {% for item in chapters %}
        {% set loop_index = loop.index %}
        {% include "chapter.html" %}
    {% endfor %}

    <!-- Consolidated Capstone Revision -->
    {% include "revision.html" %}

</body>
</html>
