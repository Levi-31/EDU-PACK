[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-scholar-backend"
version = "0.1.0"
description = "Playlist Scholar: Agentic YouTube-to-Technical-Notes Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.20",
    "openai>=1.50.0",
    "youtube-transcript-api>=0.6.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "markdown>=3.7.0",
    "playwright>=1.47.0",
    "reportlab>=4.2.0",
    "cairosvg>=2.7.1",
    "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

